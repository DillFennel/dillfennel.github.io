name: Build resume PDF and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/configure-pages@v5
      - name: Install PDF dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Verify automatic text synchronization
        run: python scripts/test_build.py
      - name: Build site and matching PDF
        run: python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site and PDF together
        id: deployment
        uses: actions/deploy-pages@v4
